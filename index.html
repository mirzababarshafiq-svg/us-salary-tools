*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--subtle);color:var(--ink)}

.navInner{width:100%;max-width:1200px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;white-space:nowrap;color:var(--ink);text-decoration:none}.brandDot{width:30px;height:30px;border-radius:9px;background:var(--ink);display:grid;place-items:center}.brandDot:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 5px rgba(18,169,122,.08)}
.navLinks{display:flex;align-items:center;gap:4px}.navItem{position:relative}.navButton{border:0;background:transparent;color:#3b4c6b;font:600 14px/1.2 inherit;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:5px;text-decoration:none}.navButton:hover,.navButton.open{background:#f6f8fb;color:var(--ink)}.arrow{font-size:12px;opacity:.6}.navButton.open .arrow{transform:rotate(180deg)}
.dropdown{position:absolute;left:0;top:calc(100% + 6px);min-width:230px;padding:6px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 14px 36px rgba(9,20,44,.14);display:none}.dropdown.show{display:block}.dropLink{display:block;width:100%;text-decoration:none;text-align:left;color:var(--ink);font:500 13px/1.25 inherit;padding:10px 12px;border-radius:10px}.dropLink:hover{background:#f6f8fb}.version{font-size:11px;font-weight:700;color:#0b6b4f;background:#e3f7ef;border:1px solid #b9ebd8;padding:6px 9px;border-radius:999px;white-space:nowrap}
@media(max-width:700px){#shellNav{height:56px}.navInner{padding:0 10px;gap:6px}.brand{font-size:15px}.brandDot{width:26px;height:26px}.navButton{padding:8px 6px;font-size:11px}.dropdown{min-width:195px}.dropLink{font-size:12px;padding:9px 10px}#appFrame{top:56px;height:calc(100% - 56px)}.version{font-size:9px;padding:5px 6px}}

<script>
(()=>{const menus=[...document.querySelectorAll('.navItem[data-menu]')];const close=()=>menus.forEach(m=>{m.querySelector('.dropdown').classList.remove('show');m.querySelector('.navButton').classList.remove('open');m.querySelector('.navButton').setAttribute('aria-expanded','false')});menus.forEach(m=>{const b=m.querySelector('.navButton'),d=m.querySelector('.dropdown');b.addEventListener('click',e=>{e.stopPropagation();const open=!d.classList.contains('show');close();if(open){d.classList.add('show');b.classList.add('open');b.setAttribute('aria-expanded','true')}})});document.addEventListener('click',close)})();
