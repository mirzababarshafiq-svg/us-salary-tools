<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application-version" content="2026.1.0">
  <title>US Salary Tools — 2026</title>
  <style>
    :root{--ink:#0e1526;--muted:#5a6b86;--border:#d7dee7;--surface:#fff;--subtle:#f6f8fb;--brand:#2b6bff}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--subtle);color:var(--ink)}
    #shell{position:fixed;inset:0;background:var(--subtle)}
    #shellNav{position:fixed;top:0;left:0;right:0;height:64px;z-index:1000;display:flex;align-items:center;background:rgba(255,255,255,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);box-shadow:0 2px 10px rgba(9,20,44,.06)}
    .navInner{width:100%;max-width:1200px;margin:auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:750;letter-spacing:-.02em;white-space:nowrap}
    .brandDot{width:30px;height:30px;border-radius:9px;background:#0e1526;display:grid;place-items:center}.brandDot:after{content:"";width:8px;height:8px;border-radius:50%;background:#12a97a;box-shadow:0 0 0 5px rgba(18,169,122,.08)}
    .navLinks{display:flex;align-items:center;gap:4px}
    .navItem{position:relative}
    .navButton{border:0;background:transparent;color:#3b4c6b;font:600 14px/1.2 inherit;padding:10px 12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:5px}
    .navButton:hover,.navButton.open{background:#f6f8fb;color:#0e1526}
    .arrow{font-size:12px;opacity:.6;transition:transform .15s}.open .arrow{transform:rotate(180deg)}
    .dropdown{position:absolute;left:0;top:calc(100% + 6px);min-width:230px;padding:6px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 14px 36px rgba(9,20,44,.14);display:none}
    .dropdown.show{display:block}
    .dropButton{width:100%;text-align:left;border:0;background:transparent;color:#0e1526;font:500 13px/1.25 inherit;padding:10px 12px;border-radius:10px;cursor:pointer}
    .dropButton:hover{background:#f6f8fb}
    .version{font-size:11px;font-weight:700;letter-spacing:.04em;color:#0b6b4f;background:#e3f7ef;border:1px solid #b9ebd8;padding:6px 9px;border-radius:999px;white-space:nowrap}
    #appFrame{position:absolute;inset:64px 0 0;width:100%;height:calc(100% - 64px);border:0;background:var(--subtle)}
    #loading{position:absolute;inset:64px 0 0;display:grid;place-items:center;color:var(--muted);font-size:14px;background:var(--subtle);z-index:5}
    @media(max-width:800px){#shellNav{height:56px}.navInner{padding:0 12px}.brand{font-size:16px}.brandDot{width:26px;height:26px}.navLinks{gap:0}.navButton{padding:8px 7px;font-size:12px}.version{font-size:9px;padding:5px 7px}.dropdown{min-width:190px}.dropButton{font-size:12px;padding:9px 10px}#appFrame,#loading{top:56px;height:calc(100% - 56px)}}
  </style>
</head>
<body>
  <div id="shell">
    <header id="shellNav">
      <div class="navInner">
        <div class="brand"><span class="brandDot"></span><span>TakeHome</span></div>
        <div class="navLinks">
          <div class="navItem" data-menu="Calculators">
            <button class="navButton" type="button">Calculators <span class="arrow">⌄</span></button>
            <div class="dropdown">
              <button class="dropButton" data-action="calculator">Salary Calculator</button>
              <button class="dropButton" data-action="calculator">Paycheck Calculator</button>
              <button class="dropButton" data-action="calculator">Hourly ↔ Salary</button>
              <button class="dropButton" data-action="calculator">Overtime Calculator</button>
              <button class="dropButton" data-action="calculator">Bonus Tax Calculator</button>
            </div>
          </div>
          <div class="navItem" data-menu="States">
            <button class="navButton" type="button">States <span class="arrow">⌄</span></button>
            <div class="dropdown">
              <button class="dropButton" data-state="California">California</button>
              <button class="dropButton" data-state="Texas">Texas</button>
              <button class="dropButton" data-state="New York">New York</button>
              <button class="dropButton" data-state="Florida">Florida</button>
              <button class="dropButton" data-state="Washington">Washington</button>
            </div>
          </div>
          <div class="navItem" data-menu="Resources">
            <button class="navButton" type="button">Resources <span class="arrow">⌄</span></button>
            <div class="dropdown">
              <button class="dropButton" data-resource="W-4 & Withholding">W-4 & Withholding</button>
              <button class="dropButton" data-resource="State taxes">State taxes</button>
              <button class="dropButton" data-resource="Retirement">Retirement</button>
              <button class="dropButton" data-action="calculator">Methodology</button>
            </div>
          </div>
          <div class="navItem"><button class="navButton" id="aboutBtn" type="button">About</button></div>
        </div>
        <div class="version">Engine v2026.1.0</div>
      </div>
    </header>
    <div id="loading">Loading US Salary Tools v2026.1.0…</div>
    <iframe id="appFrame" title="US Salary Tools calculator" referrerpolicy="no-referrer"></iframe>
  </div>

  <script>
  (()=>{
    const RAW='https://raw.githubusercontent.com/mirzababarshafiq-svg/us-salary-tools/a3bac11872b4c5bafa8bb626aa1dee10dfcd17ed/index.html';
    const frame=document.getElementById('appFrame');
    const loading=document.getElementById('loading');
    const menus=[...document.querySelectorAll('.navItem[data-menu]')];

    function closeMenus(){menus.forEach(m=>{m.querySelector('.dropdown')?.classList.remove('show');m.querySelector('.navButton')?.classList.remove('open')})}
    menus.forEach(m=>{
      const b=m.querySelector('.navButton');
      b.addEventListener('click',e=>{
        e.stopPropagation();
        const dd=m.querySelector('.dropdown');
        const willOpen=!dd.classList.contains('show');
        closeMenus();
        if(willOpen){dd.classList.add('show');b.classList.add('open')}
      });
    });
    document.addEventListener('click',closeMenus);

    function frameDoc(){try{return frame.contentDocument||frame.contentWindow.document}catch{return null}}
    function scrollToCalculator(){const d=frameDoc();if(d){d.getElementById('calculator')?.scrollIntoView({behavior:'smooth',block:'start'})}}
    function selectState(name){
      const d=frameDoc(); if(!d) return;
      const buttons=[...d.querySelectorAll('#calculator button')];
      const trigger=buttons.find(b=>/^[A-Z]{2}\s+/.test(b.textContent.trim())&&b.textContent.includes(name));
      if(trigger){trigger.click();setTimeout(()=>{const item=[...d.querySelectorAll('button')].find(b=>b.textContent.trim()===name);if(item)item.click()},40)}
      setTimeout(scrollToCalculator,80);
    }
    function scrollToResource(name){
      const d=frameDoc(); if(!d) return;
      const nodes=[...d.querySelectorAll('h1,h2,h3,h4,div,span')];
      const node=nodes.find(n=>(n.textContent||'').trim()===name)||nodes.find(n=>(n.textContent||'').includes(name));
      if(node) node.scrollIntoView({behavior:'smooth',block:'start'}); else scrollToCalculator();
    }

    document.querySelectorAll('.dropButton').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      if(b.dataset.state) selectState(b.dataset.state);
      else if(b.dataset.resource) scrollToResource(b.dataset.resource);
      else scrollToCalculator();
      closeMenus();
    }));
    document.getElementById('aboutBtn').addEventListener('click',()=>{closeMenus();scrollToResource('Why trust these numbers')});

    function patchHtml(html){
      let s=html.replace('engineVersion:"mock-2.0.0"','engineVersion:"2026.1.0"');
      s=s.replace(/\$\.useEffect\(\(\)=>\{localStorage\.setItem\("th-input",JSON\.stringify\(l\)\);let f=new URLSearchParams;[\s\S]*?window\.history\.replaceState\(null,"",k\)\},\[l\]\)/,'$.useEffect(()=>{localStorage.setItem("th-input",JSON.stringify(l))},[l])');
      s=s.replace('navigator.clipboard.writeText(window.location.href)','navigator.clipboard.writeText(window.top.location.href)');
      s=s.replace('<title>React Artifact</title>','<title>US Salary Tools — 2026</title>');
      if(!s.includes('<base href=')) s=s.replace('</head>','<base href="https://us-salary-tools.pages.dev/"><style>header{display:none!important}body{padding-top:0!important}</style></head>');
      return s;
    }

    function activate(){
      loading.style.display='none';
      try{
        const w=frame.contentWindow,d=frameDoc();
        if(!d||!w)return;
        d.querySelector('header')?.remove();
        if(w.history && !w.__salaryToolsPatched){
          w.history.replaceState=()=>{};
          w.history.pushState=()=>{};
          w.__salaryToolsPatched=true;
        }
      }catch{}
    }

    async function boot(){
      try{
        let s=sessionStorage.getItem('ust2026html');
        if(!s){
          const r=await fetch(RAW,{cache:'no-store'});
          if(!r.ok) throw new Error('legacy bundle fetch failed');
          s=await r.text();
          sessionStorage.setItem('ust2026html',s);
        }
        frame.srcdoc=patchHtml(s);
      }catch(e){
        frame.src=RAW;
      }
      frame.addEventListener('load',activate,{once:true});
    }
    boot();

    if(location.search){history.replaceState(null,'',location.pathname+location.hash)}
  })();
  </script>
</body>
</html>
